# Run by every user's systemd-tmpfiles-setup.service, as that user.
# The Android emulator's feature switches, copied once into the profile, so a
# file of the user's own, or edits to ours, stay. They turn off Vulkan and
# GLDirectMem, which crashed the emulator in Boxes (PLAN.md, Boxes). The file
# has no comments: the emulator's parser may not take them.
C %h/.android/advancedFeatures.ini - - - - /usr/lib/android-dev-vm/emulator/advancedFeatures.ini
