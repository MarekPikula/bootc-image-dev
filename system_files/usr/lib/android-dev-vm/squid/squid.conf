# Squid is dev's only way out of the VM (see nftables/dev-egress.nft): HTTPS
# through CONNECT to port 443, only to the domains in allowlist.txt. No plain
# HTTP, which anyone on the path could read or tamper with. squid.service reads
# this file through its drop-in, squid.service.d/10-android-dev-vm.conf.

http_port 127.0.0.1:3128

# -n: match names only. Without it, a CONNECT to an IP literal is reverse-
# resolved, and whoever controls that PTR record could match an entry.
acl allowed dstdomain -n "/usr/lib/android-dev-vm/squid/allowlist.txt"
acl CONNECT method CONNECT
acl https_port port 443

http_access deny !CONNECT
http_access deny !https_port
http_access allow localhost allowed
# Also covers the cache manager.
http_access deny all

# A forwarder only: nothing is cached, and servers aren't told the client's
# address. (Squid insists on sending Via.)
cache deny all
forwarded_for delete

# Squid's default, spelled out because android-dev-denied parses it.
access_log daemon:/var/log/squid/access.log squid
