# Git over SSH to GitHub, through Squid to GitHub's SSH on port 443, trusting
# only GitHub's published host keys. See PLAN.md, Network containment. Linked
# as 30-android-dev-vm-github.conf, ahead of Fedora's 50-redhat.conf, since
# the first value ssh reads wins. The proxy is the one in proxy.env.
Host github.com ssh.github.com
	HostName ssh.github.com
	Port 443
	ProxyCommand /usr/bin/socat - PROXY:127.0.0.1:%h:%p,proxyport=3128
	HostKeyAlias github.com
	GlobalKnownHostsFile /usr/lib/android-dev-vm/ssh/github-known-hosts
	UserKnownHostsFile /dev/null
	StrictHostKeyChecking yes
