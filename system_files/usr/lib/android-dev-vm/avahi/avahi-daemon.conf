# avahi runs here only for spice-webdavd (Boxes' shared folders), which won't
# start without it. It needs avahi's D-Bus API, not the network: lo is the only
# interface allowed, so mDNS stays inside the VM. Wide-area browsing would send
# unicast DNS queries as avahi, outside dev's rule, so it's off. See PLAN.md,
# Boxes.
[server]
allow-interfaces=lo
enable-dbus=yes

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=no
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no
