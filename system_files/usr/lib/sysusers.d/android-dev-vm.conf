# Accounts for the Android dev VM (see CLAUDE.md). The IDs are fixed: the
# nftables rule matches dev by UID. sysusers creates both accounts locked, and
# android-dev-firstboot.service sets their passwords.

# admin: administration only.
u admin 1000 "Administrator" /var/home/admin /bin/bash
m admin wheel

# dev: daily work and Claude Code. Must never gain root, so no extra groups:
# not wheel, and not empower (which Kinoite's polkit rules treat as
# all-powerful). The Android emulator needs no kvm membership: Fedora's udev
# rules make /dev/kvm world-accessible (0666).
u dev 1500 "Developer" /var/home/dev /bin/bash
