# plymouthd can hang while quitting the boot splash. This unit then times out
# after 20 s, but that stops only the `plymouth quit` client: plymouthd keeps
# the display and tty1, and plymouth-quit-wait.service (no timeout), which the
# gettys and the rest of the boot wait for, waits forever. So kill plymouthd
# when the quit didn't succeed. android-dev-firstboot.service, whose prompt
# needs tty1, starts after this unit.
[Service]
ExecStopPost=-/usr/bin/sh -c '[ "$$SERVICE_RESULT" = success ] || pkill -KILL -x plymouthd'
