# dev's user manager also needs dev's egress rule. It doesn't go through
# pam_nologin: with lingering on (`loginctl enable-linger dev`, admin only), it
# starts at boot without a login, so systemd-user-sessions' fail-closed
# dependency wouldn't hold it back.
[Unit]
Requires=dev-egress-firewall.service
After=dev-egress-firewall.service
