# Language, keyboard layout and time zone, before the passwords. Runs until our
# first boot has finished, since ConditionFirstBoot never holds here (the image
# ships an empty /etc/machine-id). See PLAN.md, Privilege.
[Unit]
# An empty assignment resets every condition, so the other one is repeated.
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc
ConditionPathExists=!/var/lib/android-dev-vm/firstboot.done

[Service]
# systemd-firstboot asks only for what has no file, and tmpfiles has already
# copied systemd's fallbacks from /usr/share/factory. Remove those while
# untouched. A setting someone chose stays.
ExecStartPre=/usr/bin/sh -c 'for f in locale.conf vconsole.conf; do if cmp -s "/etc/$$f" "/usr/share/factory/etc/$$f"; then rm "/etc/$$f"; fi; done'
# Fedora's command, plus --chrome=no: no header and footer bars. They're drawn
# for the screen's size when the prompt starts, and a resize (Boxes does that
# as its window settles) scrambles them over the questions.
ExecStart=
ExecStart=systemd-firstboot --prompt-locale --prompt-keymap-auto --prompt-timezone --prompt-root-password --mute-console=yes --chrome=no
