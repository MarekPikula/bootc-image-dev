# Runs Squid with the image's config instead of /etc/squid/squid.conf, so
# config and allowlist update with the image. Fedora's cache_swap.sh only
# initialises cache_dirs, and there are none.
[Service]
ExecStartPre=
ExecStart=
ExecStart=!/usr/sbin/squid --foreground -f /usr/lib/android-dev-vm/squid/squid.conf
