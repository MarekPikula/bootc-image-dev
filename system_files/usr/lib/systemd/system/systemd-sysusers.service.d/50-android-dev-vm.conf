# Fedora's unit imports password credentials for root only. Also import them
# for admin and dev, so a headless boot (e.g. the CI VM test) can set their
# passwords and skip the first-boot prompt.
[Service]
ImportCredential=passwd.hashed-password.admin
ImportCredential=passwd.hashed-password.dev
ImportCredential=passwd.plaintext-password.admin
ImportCredential=passwd.plaintext-password.dev
