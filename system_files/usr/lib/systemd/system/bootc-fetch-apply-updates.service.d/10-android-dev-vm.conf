# Updates are downloaded and staged, never applied by a reboot of their own:
# the stock unit runs `bootc upgrade --apply`, which reboots as soon as an
# update is staged, in the middle of someone's work. The staged image applies
# at the next reboot the user chooses. The timer is enabled from /usr by
# build_files/40-services.sh.
[Unit]
Description=Download and stage bootc updates

[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
