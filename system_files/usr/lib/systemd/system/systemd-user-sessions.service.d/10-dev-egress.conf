# Fail closed: without dev's egress rule, user sessions aren't permitted.
# /run/nologin (created at boot by tmpfiles) then stays, and pam_nologin in the
# plasmalogin, login and sshd PAM stacks refuses everyone but root. Stopping
# dev-egress-firewall.service leaves the rule loaded, but stops this unit too,
# which puts /run/nologin back.
[Unit]
Requires=dev-egress-firewall.service
After=dev-egress-firewall.service
