# Kernel and boot messages on the serial port too, so a headless VM (the CI
# test) leaves a console log even if it never comes up. The last console= is
# /dev/console, so the screen (tty0) stays the main console in GNOME Boxes.
# loglevel=4: only kernel errors and worse on the consoles, as with quiet,
# since the rest printed over the first-boot questions. Unlike quiet, it
# leaves systemd's boot messages. Why not sysctl.d: PLAN.md, Boxes.
kargs = ["console=ttyS0,115200n8", "console=tty0", "loglevel=4"]
