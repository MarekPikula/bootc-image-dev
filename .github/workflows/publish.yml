name: Publish

# Builds and tests the image exactly as for a PR, then pushes the tested image
# to GHCR, where VMs update from, and its qcow2 for new VMs. Weekly too, for
# the current Kinoite base and Claude Code release.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, in order. A queued run waits rather than cancelling the
# one that's pushing.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Keep in sync with REGISTRY_IMAGE in _build-test.yml (without the tag).
  REPOSITORY: ghcr.io/marekpikula/bootc-image-dev

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <Fedora major>.<date>.<run number>, shaped like Kinoite's 44.YYYYMMDD.N.
      - id: version
        run: |
          base="$(sed -n 's/^BASE_IMAGE=//p' versions.env)"
          echo "version=${base##*:}.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >>"$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/_build-test.yml
    with:
      image-version: ${{ needs.version.outputs.version }}
      export-image: true

  # The only job that can write to the registry, and only from main: the
  # release Environment allows no other branch.
  publish:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image

      # The image goes up once, under its version. Both the artifact and that
      # manifest must have the config (the image ID) of the image the build
      # job tested. The other tags then point at the same manifest, `stable`
      # (what VMs track) last.
      - name: Push to GHCR
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TESTED_ID: ${{ needs.ci.outputs.image-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tested="sha256:${TESTED_ID:?}"
          artifact="$(skopeo inspect --raw oci:image | jq -r .config.digest)"
          [[ $artifact == "$tested" ]] ||
            { echo "::error::artifact config $artifact, not the tested $tested"; exit 1; }
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --retry-times 3 --digestfile digest oci:image "docker://$REPOSITORY:$VERSION"
          pushed="$REPOSITORY@$(<digest)"
          config="$(skopeo inspect --raw "docker://$pushed" | jq -r .config.digest)"
          [[ $config == "$tested" ]] ||
            { echo "::error::pushed config $config, not the tested $tested"; exit 1; }
          for tag in "sha-${GITHUB_SHA::12}" stable; do
            skopeo copy --retry-times 3 --preserve-digests "docker://$pushed" "docker://$REPOSITORY:$tag"
          done
          echo "$pushed: $VERSION, sha-${GITHUB_SHA::12}, stable (config $tested)"

      # The qcow2 the VM test booted, for new VMs (README, Get the disk image).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-dev-vm-qcow2
          path: disk

      # The runner's podman (4.9) can't push artifacts.
      - name: Install oras
        env:
          ORAS_VERSION: 1.3.4
          ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
        run: |
          curl -fsSLo /tmp/oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  /tmp/oras.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras

      # oras names each layer after its file, which `podman artifact extract`
      # uses. The image's OCI layout goes first, to make room for the chunks.
      - name: Push the qcow2 to GHCR
        working-directory: disk
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ../image
          split -b 256M -d -a 3 android-dev-vm.qcow2 android-dev-vm.qcow2.
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras push --artifact-type application/vnd.android-dev-vm.qcow2.v1 \
            --annotation "org.opencontainers.image.version=$VERSION" \
            "$REPOSITORY:disk-$VERSION" android-dev-vm.qcow2.*
          oras tag "$REPOSITORY:disk-$VERSION" disk
