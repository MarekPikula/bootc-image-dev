name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Checks show up as "ci / lint" and "ci / build" (which includes the VM test).
  ci:
    uses: ./.github/workflows/_build-test.yml
